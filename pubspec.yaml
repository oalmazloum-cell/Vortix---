name: vortex
description: "فورتكس للمحاسبة - بيع، مخزون، ديون، وحسابات محلك كلها من جوالك"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  barcode: ^2.2.9
  barcode_widget: ^2.0.4
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  cupertino_ui: ^1.1.7
  esc_pos_utils_plus: ^2.0.4
  file_picker: ^13.4.1
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_localizations:
    sdk: flutter
  image: ^4.13.1
  intl: ^0.20.3
  local_auth: ^3.0.2
  material_ui: ^1.11.1
  mobile_scanner: ^7.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  print_bluetooth_thermal: ^1.2.5
  printing: ^5.15.1
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  sqflite: ^2.4.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
